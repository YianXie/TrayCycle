name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    env:
      SECRET_KEY: ci-only-not-a-secret
      ADMIN_1_PASSWORD: ci-only-not-a-secret
      ADMIN_2_PASSWORD: ci-only-not-a-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/traycycle_ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traycycle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: uv run python manage.py test

  backend-migration-upgrade:
    name: Backend Migration Upgrade
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-only-not-a-secret
      ADMIN_1_PASSWORD: ci-only-not-a-secret
      ADMIN_2_PASSWORD: ci-only-not-a-secret
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/traycycle_ci
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: traycycle_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          path: head

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Apply target branch migrations
        working-directory: ./base/backend
        run: |
          uv sync --locked
          uv run python manage.py migrate --no-input

      - name: Apply pull request migrations
        working-directory: ./head/backend
        run: |
          uv sync --locked
          uv run python manage.py migrate --no-input

  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: "npm"
          cache-dependency-path: ./frontend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build
        run: npm run build
